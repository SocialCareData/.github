name: Add or update an initiative
description: Propose a new initiative or changes to an existing record
labels: "ingest"
title: "[Add/Update] "
body:
  - type: input
    id: name
    attributes:
      label: name
      description: Full official name of the initiative.
      placeholder: 
    validations:
      required: false

  - type: input
    id: acronym
    attributes:
      label: acronym
      description: Short code or abbreviation (optional).
      placeholder: 
    validations:
      required: false

  - type: input
    id: owner_org
    attributes:
      label: owner_org
      description: Organisation that owns or stewards the initiative.
      placeholder: 
    validations:
      required: true

  - type: input
    id: homepage_url
    attributes:
      label: homepage_url
      description: Public landing page for the initiative (URL).
      placeholder: 
    validations:
      required: false

  - type: input
    id: scope_domains
    attributes:
      label: scope_domains
      description: Topical domains/tags; semicolon-separated (e.g., health;terminology).
      placeholder: 
    validations:
      required: false

  - type: input
    id: stage
    attributes:
      label: stage
      description: Lifecycle status (e.g planning | draft | active | deprecated).
      placeholder: 
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: interoperability_notes
      description: Brief notes on mappings/alignments, or other comments.
      placeholder: 
    validations:
      required: false
